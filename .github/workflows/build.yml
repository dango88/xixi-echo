name: 打包 Windows 客户端

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  # 只烘焙服务端地址；客户端不内置任何密钥，首次启动必须走 QQ 申请流程。
  # 地址配置在仓库 Settings → Secrets and variables → Actions → Variables 的 SERVER_URL
  SERVER_URL: ${{ vars.SERVER_URL || 'https://score.xn--hlr389bc3tmof.cn' }}

# 发 release 需要 GITHUB_TOKEN 的 contents 写权限（默认只读）
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 烘焙服务端地址（不含密钥）
        shell: pwsh
        run: |
          $lines = @(
            ('DEFAULT_SERVER = "' + $env:SERVER_URL + '"'),
            'DEFAULT_KEY_ID = ""',
            'DEFAULT_SECRET = ""'
          )
          Set-Content -Path xixi_echo/build_config.py -Value $lines -Encoding utf8
          Write-Host "build_config.py 已生成（仅地址，无密钥）"

      - name: 计算版本号并校验一致性
        id: ver
        shell: pwsh
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          $m = (Select-String -Path xixi_echo/__init__.py -Pattern '__version__ = "(.+)"').Matches[0]
          $file = $m.Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/', ''
            # 防呆：tag 名必须与代码内版本号一致，否则构建出的 exe 自报版本错位（v0.1.5 事故）
            if ($v -ne "v$file") {
              Write-Error "tag ($v) 与 xixi_echo/__init__.py 的 __version__ (v$file) 不一致，请先改版本号再打 tag"
              exit 1
            }
          } else {
            $v = "v$file"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version=$v"

      - name: PyInstaller 打包
        # --uac-admin：exe 清单要求管理员。鸣潮带管理员启动，Windows UIPI 会拦截
        # 普通权限进程的全局热键（游戏持焦点时不触发），客户端必须同级提权。
        run: |
          pyinstaller --noconsole --name xixi-echo --add-data "assets;assets" --icon assets/xixi-echo.ico --uac-admin run.py

      - name: Inno Setup 出安装包
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$env:APP_VERSION installer.iss
          Get-ChildItem output

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xixi-echo-setup
          path: output/xixi-echo-setup.exe

      - name: 发到 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: output/xixi-echo-setup.exe
